<div class="tb-evaluation-license-dialog">
  <mat-toolbar fxLayout="row" color="primary">
    <h2 translate>edge.evaluation-license-usage</h2>
    <span fxFlex></span>
    <button mat-icon-button
            (click)="close()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <mat-progress-bar color="warn" mode="indeterminate" *ngIf="isLoading$ | async">
  </mat-progress-bar>
  <div style="height: 4px;" *ngIf="!(isLoading$ | async)"></div>
  <div mat-dialog-content>
    <p class="tb-evaluation-license-content enable" style="margin-bottom: 10px;">
      {{'edge.evaluation-license-non-production-warn' | translate}}
    </p>
    <div class="tb-evaluation-license-content" fxLayout="row">
      <div fxFlex fxLayout="column">
        <div [innerHTML]="'edge.evaluation-license-text-full' | translate" style="margin-bottom: 10px;"></div>
        <div fxLayout="row" fxLayoutAlign="center center">
          <button mat-raised-button color="warn"
                  type="button"
                  [disabled]="(isLoading$ | async)" (click)="getPersonalLicense()">
            <mat-icon>trending_up</mat-icon>
            <span>{{ 'edge.get-personal-license' | translate }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div mat-dialog-actions fxLayout="row">
    <span fxFlex></span>
    <button mat-button
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="close()"
            style="margin-right:20px;">
      {{ 'action.close' | translate }}
    </button>
  </div>
</div>

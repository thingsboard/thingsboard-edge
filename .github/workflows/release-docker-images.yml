name: Release Docker Images

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'What do you want to build?'
        required: true
        type: choice
        default: 'LTS Release'
        options:
          - LTS Release
          - Major Release
      allow_snapshot:
        description: 'Allow pushing a -SNAPSHOT version'
        required: false
        type: boolean
        default: false
      dedupe_yarn_lock:
        description: 'Deduplicate @angular/* and @angular-devkit/* packages in ui-ngx/yarn.lock before building'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-docker-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: ${{ inputs.release_type }} (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment: docker-hub-release
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Java version
        id: java
        run: |
          JAVA_VERSION=$(grep -m1 -oP '(?<=<maven.compiler.source>)[^<]+' pom.xml)
          echo "Java version from pom.xml: $JAVA_VERSION"
          echo "version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.java.outputs.version }}
          cache: 'maven'

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # Merges between CE/PE/Edge branches tend to leave a second, older copy of Angular build tooling in ui-ngx/yarn.lock
      # (e.g. "@angular/build@^20.0.0" from @angular-builders/custom-esbuild next to the pinned "@angular/build"). The
      # production UI is then built with mixed Angular versions and dashboards render as empty cards. Collapse duplicates
      # within the Angular scopes only; the non-frozen 'yarn install' run by Maven prunes the entries left unused.
      - name: Deduplicate Angular packages in yarn.lock
        if: ${{ inputs.dedupe_yarn_lock }}
        working-directory: ui-ngx
        run: |
          if [[ ! -f yarn.lock ]]; then
            echo "No ui-ngx/yarn.lock on this branch - skipping"
            exit 0
          fi
          DEDUPE="npx -y yarn-deduplicate@6.0.2 --scopes @angular @angular-devkit"
          DUPLICATES=$($DEDUPE --list yarn.lock)
          if [[ -z "$DUPLICATES" ]]; then
            echo "No duplicate Angular packages in yarn.lock"
            exit 0
          fi
          echo "$DUPLICATES"
          $DEDUPE yarn.lock
          echo "::warning::ui-ngx/yarn.lock had duplicate Angular packages and was deduplicated for this build only. Commit the fix to '$GITHUB_REF_NAME'."
          {
            echo "### Deduplicated ui-ngx/yarn.lock"
            echo '```'
            echo "$DUPLICATES"
            echo '```'
            echo "The fix is not committed: run \`npx yarn-deduplicate --scopes @angular @angular-devkit yarn.lock && yarn install\` in \`ui-ngx\` on \`$GITHUB_REF_NAME\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve version and profile
        id: meta
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          ALLOW_SNAPSHOT: ${{ inputs.allow_snapshot }}
        run: |
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$RELEASE_TYPE" == "LTS Release" ]]; then
            PROFILE=push-lts-docker-amd-arm-images
            if [[ "$GITHUB_REF_NAME" != lts-* && "$GITHUB_REF_NAME" != release-* ]]; then
              echo "::error::LTS Release must be built from an lts-* or release-* branch (got '$GITHUB_REF_NAME')"
              exit 1
            fi
            LTS_TAG=$(mvn -q -pl msa help:evaluate -P "$PROFILE" -Dexpression=docker.lts.tag -DforceStdout)
            TAGS="$VERSION $LTS_TAG"
          else
            PROFILE=push-docker-amd-arm-images
            TAGS="$VERSION latest"
          fi
          if [[ "$VERSION" == *-SNAPSHOT && "$ALLOW_SNAPSHOT" != "true" ]]; then
            echo "::error::Version $VERSION is a SNAPSHOT. Set the release version first or enable 'allow_snapshot'."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Branch: $GITHUB_REF_NAME | Version: $VERSION | Profile: $PROFILE | Tags: $TAGS"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        env:
          MAVEN_OPTS: '-Xmx6g'
          PROFILE: ${{ steps.meta.outputs.profile }}
        run: |
          mvn clean install -DskipTests -Ddockerfile.skip=false -P "$PROFILE"

      - name: Verify pushed images
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Pushed images ($RELEASE_TYPE, \`$GITHUB_REF_NAME\`)" >> "$GITHUB_STEP_SUMMARY"
          for image in tb-edge tb-edge-node; do
            for tag in $TAGS; do
              ref="thingsboard/$image:$tag"
              platforms=$(docker buildx imagetools inspect "$ref" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
              echo "$ref -> $platforms"
              if [[ "$platforms" != *linux/amd64* || "$platforms" != *linux/arm64* ]]; then
                echo "::error::$ref is missing linux/amd64 or linux/arm64 (got: $platforms)"
                exit 1
              fi
              echo "- \`$ref\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
            done
          done

services:
# Redis cluster
# The latest version of Redis compatible with ThingsBoard Edge is 7.2
  redis-node-0:
    image: bitnamilegacy/redis-cluster:7.2
    volumes:
      - ./tb-edge/redis-cluster-data-0:/bitnami/redis/data
    environment:
      - 'REDIS_PASSWORD=thingsboard'
      - 'REDISCLI_AUTH=thingsboard'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'

  redis-node-1:
    image: bitnamilegacy/redis-cluster:7.2
    volumes:
      - ./tb-edge/redis-cluster-data-1:/bitnami/redis/data
    depends_on:
      - redis-node-0
    environment:
      - 'REDIS_PASSWORD=thingsboard'
      - 'REDISCLI_AUTH=thingsboard'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'

  redis-node-2:
    image: bitnamilegacy/redis-cluster:7.2
    volumes:
      - ./tb-edge/redis-cluster-data-2:/bitnami/redis/data
    depends_on:
      - redis-node-1
    environment:
      - 'REDIS_PASSWORD=thingsboard'
      - 'REDISCLI_AUTH=thingsboard'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'

  redis-node-3:
    image: bitnamilegacy/redis-cluster:7.2
    volumes:
      - ./tb-edge/redis-cluster-data-3:/bitnami/redis/data
    depends_on:
      - redis-node-2
    environment:
      - 'REDIS_PASSWORD=thingsboard'
      - 'REDISCLI_AUTH=thingsboard'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'

  redis-node-4:
    image: bitnamilegacy/redis-cluster:7.2
    volumes:
      - ./tb-edge/redis-cluster-data-4:/bitnami/redis/data
    depends_on:
      - redis-node-3
    environment:
      - 'REDIS_PASSWORD=thingsboard'
      - 'REDISCLI_AUTH=thingsboard'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'

  redis-node-5:
    image: bitnamilegacy/redis-cluster:7.2
    volumes:
      - ./tb-edge/redis-cluster-data-5:/bitnami/redis/data
    depends_on:
      - redis-node-0
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
    environment:
      - 'REDIS_PASSWORD=thingsboard'
      - 'REDISCLI_AUTH=thingsboard'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'
      - 'REDIS_CLUSTER_REPLICAS=1'
      - 'REDIS_CLUSTER_CREATOR=yes'

# ThingsBoard setup to use redis-cluster
  tb-edge1:
    env_file:
      - cache-redis-cluster.env
    depends_on:
      - redis-node-5
  tb-edge2:
    env_file:
      - cache-redis-cluster.env
    depends_on:
      - redis-node-5
  tb-edge3:
    env_file:
      - cache-redis-cluster.env
    depends_on:
      - redis-node-5